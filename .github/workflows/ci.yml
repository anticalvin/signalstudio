name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env: { CI: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test            # unit tests, including static GLSL validation (glslang is required when CI=1)
      - run: npm run test:e2e    # builds, serves, drives headless Chromium on SwiftShader
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: artifacts, path: artifacts/ }
