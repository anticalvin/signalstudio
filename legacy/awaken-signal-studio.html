<title>AWAKEN Signal Studio</title>
<style>

:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100%}

header button{padding:5px 8px;flex:none}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#left{display:none}
#vp{flex:1;position:relative;min-height:0;background:#0d0d0d;display:flex;align-items:center;justify-content:center}

#tools{position:absolute;left:6px;top:6px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 12px)}
#tools button{background:rgba(20,20,20,.88);padding:4px 8px;min-height:30px}#tools button.on{background:var(--ac)}
#st{position:absolute;left:6px;bottom:4px;font-size:11px;color:#ccc;background:rgba(20,20,20,.75);padding:2px 6px;border-radius:3px;pointer-events:none}
#right{display:flex;flex-direction:column;background:var(--pn);border-top:1px solid var(--ln)}
#body{display:none;overflow:auto;padding:8px;height:38vh;-webkit-overflow-scrolling:touch}
#right.open #body{display:block}#right.big #body{height:70vh}
#tabs{display:flex}#tabs button{flex:1;border:0;border-radius:0;background:none;border-top:2px solid transparent;min-height:44px}

#xp{display:block;width:100%;margin-bottom:6px}
.ph{padding:8px;border-bottom:1px solid var(--ln);font-weight:600}#lbody{flex:1;overflow:auto;padding:8px}

 #left{display:flex;flex-direction:column;width:260px;border-right:1px solid var(--ln);background:var(--pn)}
 #right{width:340px;border-top:0;border-left:1px solid var(--ln)}#body{display:block;flex:1;height:auto}#tabs{order:-1;border-bottom:1px solid var(--ln)}

.knob{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:4px;touch-action:none;user-select:none;cursor:ns-resize}
.knob:hover{background:#222}.kv{font-size:11px;font-variant-numeric:tabular-nums}.kl{font-size:10px;color:var(--dm);text-align:center;line-height:1.1}

.pv{width:44px;height:44px;flex:none;border-radius:3px}

#st{display:none}@media(min-width:900px){#st{display:block}}
.fxrow{display:flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:4px;margin:3px 0;padding:4px 6px;cursor:pointer}.fxrow.sel{border-color:var(--ac);background:#2a1914}.fxrow.off{opacity:.5}
.tag{font-size:10px;padding:1px 5px;border-radius:3px;background:#2c2c2c;color:var(--dm);white-space:nowrap}h3{margin:6px 0 2px;font-size:15px}
.pv-depth{background:linear-gradient(90deg,#fff,#000)}.pv-grade{background:linear-gradient(135deg,#f6c,#38f)}
#tools select{background:rgba(20,20,20,.88);border:1px solid var(--ln);border-radius:4px;min-height:30px;padding:0 6px}
